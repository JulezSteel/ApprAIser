<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ApprAIser WIN</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; color: white; font-family: sans-serif; }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-4">
    <div id="root" class="w-full max-w-md"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_key') || '');
            const [status, setStatus] = useState("Bereit.");
            const [result, setResult] = useState(null);
            const [preview, setPreview] = useState(null);

            useEffect(() => { if(apiKey) localStorage.setItem('gemini_key', apiKey); }, [apiKey]);

            const resetKey = () => {
                localStorage.removeItem('gemini_key');
                setApiKey('');
                setResult(null);
            };

            const runScan = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (ev) => setPreview(ev.target.result);
                reader.readAsDataURL(file);

                setStatus("Analysiere...");
                setResult(null);

                try {
                    const base64Data = await new Promise((resolve) => {
                        const r = new FileReader();
                        r.onload = (ev) => resolve(ev.target.result.split(',')[1]);
                        r.readAsDataURL(file);
                    });

                    // DER TRICK: generationConfig zwingt Google zu JSON
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: "Identifiziere dieses Objekt. JSON Output required: { \"item\": \"Name\", \"price\": \"Wert in Euro\", \"script\": \"Verkaufs-Satz\" }" },
                                    { inline_data: { mime_type: file.type, data: base64Data } }
                                ]
                            }],
                            generationConfig: {
                                responseMimeType: "application/json"
                            }
                        })
                    });

                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error?.message || "API Fehler");

                    const text = data.candidates[0].content.parts[0].text;
                    const parsed = JSON.parse(text); // Jetzt ist es garantiert sauberes JSON
                    
                    setResult(parsed);
                    setStatus("Fertig!");

                } catch (err) {
                    setStatus("Fehler: " + err.message);
                }
            };

            return (
                <div className="flex flex-col gap-6 w-full">
                    <div className="flex justify-between items-center border-b border-gray-800 pb-4">
                        <h1 className="text-3xl font-bold text-green-500">ApprAIser</h1>
                        {apiKey && <button onClick={resetKey} className="text-xs text-gray-500 underline">Reset</button>}
                    </div>
                    
                    {!apiKey && (
                        <input 
                            type="text" 
                            placeholder="API Key eingeben..." 
                            className="w-full p-4 bg-gray-900 rounded-lg border border-gray-700 text-white" 
                            onChange={e => setApiKey(e.target.value)} 
                        />
                    )}

                    {apiKey && (
                        <label className="bg-green-500 text-black font-bold py-10 rounded-2xl flex flex-col items-center justify-center cursor-pointer active:scale-95 transition-transform shadow-lg shadow-green-900/50">
                            <span className="text-5xl mb-2">📸</span>
                            <span className="text-xl">FOTO MACHEN</span>
                            <input type="file" accept="image/*" capture="environment" className="hidden" onChange={runScan} />
                        </label>
                    )}

                    {status !== "Bereit." && status !== "Fertig!" && (
                        <div className="text-center text-green-400 animate-pulse font-mono">{status}</div>
                    )}

                    {result && (
                        <div className="bg-gray-900 p-6 rounded-2xl border border-gray-800 space-y-4 shadow-2xl">
                            <div>
                                <div className="text-xs text-gray-500 uppercase tracking-widest">Objekt</div>
                                <div className="text-2xl font-bold text-white">{result.item}</div>
                            </div>
                            <div className="h-px bg-gray-800"></div>
                            <div>
                                <div className="text-xs text-gray-500 uppercase tracking-widest">Wert</div>
                                <div className="text-4xl text-green-400 font-black">{result.price}</div>
                            </div>
                            <div className="bg-black p-4 rounded-xl italic text-gray-300 border-l-4 border-green-500">
                                "{result.script}"
                            </div>
                        </div>
                    )}
                    
                    {/* Error Box falls nötig */}
                    {status.includes("Fehler") && (
                        <div className="bg-red-900/50 p-4 rounded border border-red-500 text-white text-sm break-words">
                            {status}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
