<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApprAIser Rescue</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-4 font-sans flex flex-col items-center min-h-screen">
    <div id="root" class="w-full max-w-md"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_key') || '');
            const [status, setStatus] = useState("Bereit.");
            const [result, setResult] = useState(null);
            const [preview, setPreview] = useState(null);

            useEffect(() => { if(apiKey) localStorage.setItem('gemini_key', apiKey); }, [apiKey]);

            const runScan = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                // Vorschau zeigen
                const reader = new FileReader();
                reader.onload = (ev) => setPreview(ev.target.result);
                reader.readAsDataURL(file);

                setStatus("Lade hoch... (Gemini 2.0 Flash)");
                setResult(null);

                try {
                    // 1. Bild zu Base64
                    const base64Data = await new Promise((resolve) => {
                        const r = new FileReader();
                        r.onload = (ev) => resolve(ev.target.result.split(',')[1]);
                        r.readAsDataURL(file);
                    });

                    // 2. Anfrage an DEIN Modell (gemini-2.0-flash)
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: "Bestimme dieses Objekt für einen Flohmarkt-Verkäufer. Gib mir JSON zurück: { \"item\": \"Name\", \"price\": \"XX €\", \"script\": \"Verhandlungstipp\" }" },
                                    { inline_data: { mime_type: file.type, data: base64Data } }
                                ]
                            }]
                        })
                    });

                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error?.message || "API Fehler");

                    // 3. Ergebnis parsen
                    const text = data.candidates[0].content.parts[0].text;
                    const jsonMatch = text.match(/\{[\s\S]*\}/);
                    const parsed = JSON.parse(jsonMatch ? jsonMatch[0] : text);
                    
                    setResult(parsed);
                    setStatus("Fertig!");

                } catch (err) {
                    setStatus("Fehler: " + err.message);
                }
            };

            return (
                <div className="flex flex-col gap-6 w-full">
                    <h1 className="text-3xl font-bold text-green-400 border-b border-gray-800 pb-2">ApprAIser <span className="text-xs text-white">RESCUE</span></h1>
                    
                    {!apiKey && <input type="text" placeholder="API Key..." className="p-3 bg-gray-900 rounded border border-gray-700" onChange={e => setApiKey(e.target.value)} />}

                    {/* Großer Kamera Button */}
                    <label className="bg-green-500 text-black font-bold py-12 rounded-xl flex flex-col items-center justify-center cursor-pointer active:scale-95 transition-transform">
                        <span className="text-4xl mb-2">📸</span>
                        <span>FOTO MACHEN</span>
                        <input type="file" accept="image/*" capture="environment" className="hidden" onChange={runScan} />
                    </label>

                    <div className="text-center text-gray-400 text-sm">{status}</div>

                    {/* Ergebnis Anzeige */}
                    {result && (
                        <div className="bg-gray-900 p-6 rounded-xl border border-gray-700 space-y-4 animate-fade-in">
                            <div>
                                <div className="text-xs text-gray-500 uppercase">Objekt</div>
                                <div className="text-2xl font-bold">{result.item}</div>
                            </div>
                            <div>
                                <div className="text-xs text-gray-500 uppercase">Wert</div>
                                <div className="text-4xl text-green-400 font-bold">{result.price}</div>
                            </div>
                            <div className="italic text-gray-300">"{result.script}"</div>
                        </div>
                    )}
                    
                    {preview && !result && (
                        <img src={preview} className="w-full rounded-xl opacity-50" />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
