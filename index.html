<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApprAIser DEBUG</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white font-mono p-4">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_key') || '');
            const [logs, setLogs] = useState([]);
            const [isBusy, setIsBusy] = useState(false);

            // Helfer um Dinge auf den Schirm zu schreiben
            const log = (msg) => {
                console.log(msg);
                setLogs(prev => [...prev, `${new Date().toLocaleTimeString()} > ${msg}`]);
            };

            useEffect(() => {
                if(apiKey) localStorage.setItem('gemini_key', apiKey);
            }, [apiKey]);

            const handleFile = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setIsBusy(true);
                setLogs([]); // Reset logs
                log("1. Datei ausgewählt: " + file.name);
                log("2. Dateigröße: " + (file.size / 1024).toFixed(2) + " KB");

                try {
                    // Bild einlesen
                    log("3. Lese Bild ein...");
                    const base64 = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });
                    log("4. Bild eingelesen. Länge Base64: " + base64.length);

                    const base64Data = base64.split(',')[1];
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
                    
                    log("5. Sende Anfrage an API...");
                    log("URL: " + url.replace(apiKey, "HIDDEN_KEY"));

                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: "Describe this image. Return JSON: { \"item\": \"name\" }." },
                                    { inline_data: { mime_type: file.type, data: base64Data } }
                                ]
                            }]
                        })
                    });

                    log("6. Antwort erhalten! Status: " + response.status);

                    if (!response.ok) {
                        const errorText = await response.text();
                        log("FEHLER VOM SERVER: " + errorText);
                        throw new Error("Server Error: " + response.status);
                    }

                    const data = await response.json();
                    log("7. Daten geparst.");
                    log("ANTWORT: " + JSON.stringify(data, null, 2));

                } catch (err) {
                    log("FATAL ERROR: " + err.message);
                } finally {
                    setIsBusy(false);
                    log("--- ENDE ---");
                }
            };

            return (
                <div className="max-w-md mx-auto">
                    <h1 className="text-xl font-bold text-green-400 mb-4 border-b border-green-800 pb-2">DEBUG MODE</h1>
                    
                    {!apiKey && (
                        <input 
                            type="text" 
                            placeholder="API Key hier rein..." 
                            className="w-full p-2 bg-gray-900 border border-gray-700 rounded mb-4"
                            onChange={(e) => setApiKey(e.target.value)}
                        />
                    )}

                    <input 
                        type="file" 
                        onChange={handleFile} 
                        className="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-green-500 file:text-black hover:file:bg-green-600 mb-6"
                    />

                    <div className="bg-gray-900 p-4 rounded border border-gray-800 font-mono text-xs overflow-x-auto whitespace-pre-wrap h-96">
                        {logs.length === 0 ? <span className="text-gray-600">Warte auf Aktion...</span> : logs.map((l, i) => (
                            <div key={i} className="mb-1 border-b border-gray-800 pb-1">{l}</div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
