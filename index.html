<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Hunter</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6 font-mono">
    <div id="root" class="max-w-2xl mx-auto"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_key') || '');
            const [models, setModels] = useState(null);
            const [error, setError] = useState(null);
            const [loading, setLoading] = useState(false);

            useEffect(() => { if(apiKey) localStorage.setItem('gemini_key', apiKey); }, [apiKey]);

            const listModels = async () => {
                setLoading(true);
                setError(null);
                setModels(null);

                try {
                    // Wir fragen die API: "Was hast du?"
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error?.message || "Fehler beim Abrufen der Liste");
                    }

                    // Filtere nur Modelle, die Bilder generieren können (generateContent)
                    const availableModels = data.models || [];
                    setModels(availableModels);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="flex flex-col gap-6">
                    <h1 className="text-3xl font-bold text-yellow-400 border-b border-gray-700 pb-4">🕵️‍♂️ Model Hunter</h1>
                    
                    <div>
                        <label className="block text-sm text-gray-400 mb-2">Dein API Key</label>
                        <input 
                            type="text" 
                            value={apiKey}
                            onChange={(e) => setApiKey(e.target.value)}
                            className="w-full p-3 bg-black border border-gray-600 rounded text-white font-mono"
                            placeholder="AIza..."
                        />
                    </div>

                    <button 
                        onClick={listModels} 
                        disabled={!apiKey || loading}
                        className="bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white py-3 px-6 rounded font-bold"
                    >
                        {loading ? "Suche Modelle..." : "🔍 Zeige verfügbare Modelle"}
                    </button>

                    {error && (
                        <div className="bg-red-900/50 border border-red-500 p-4 rounded text-red-200">
                            <strong>Fehler:</strong> {error}
                        </div>
                    )}

                    {models && (
                        <div className="space-y-4">
                            <h2 className="text-xl font-bold text-green-400">Gefundene Modelle ({models.length}):</h2>
                            <div className="grid gap-2">
                                {models.map(m => (
                                    <div key={m.name} className="bg-gray-800 p-3 rounded border border-gray-700 hover:border-green-500">
                                        <div className="font-bold text-white">{m.name.replace('models/', '')}</div>
                                        <div className="text-xs text-gray-400 mt-1">Methoden: {m.supportedGenerationMethods?.join(', ')}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
